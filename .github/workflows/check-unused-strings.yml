name: Check unused strings

on:
  push:
    branches: [master, admidio-5.0]
    paths: [languages/*.xml, .github/scripts/check_unused_strings.py]
  pull_request:
    branches: [master, admidio-5.0]
    paths: [languages/*.xml, .github/scripts/check_unused_strings.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unused-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check unused translation IDs
        run: python .github/scripts/check_unused_strings.py --exclude .github
