name: Sort en.xml

on:
  push:
    branches: [master, admidio-5.0]
    paths: [languages/en.xml, .github/scripts/sort_en_xml.py]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sort-en-xml:
    if: github.repository_owner == 'MightyMCoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install lxml
        run: pip install lxml
      - name: Sort translation file
        run: python .github/scripts/sort_en_xml.py
      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi
          branch="sort-language-file-$(date +'%Y%m%d')"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add languages/en.xml
          git commit -m "chore: sort en.xml alphabetically"
          git push --set-upstream origin "$branch"
          gh pr create --title "chore: sort en.xml alphabetically" --body "Created with GitHub Actions" --label "translation" --assignee "${{ github.actor }}" --base master
